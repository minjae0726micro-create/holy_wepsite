<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 방탈출 </title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }
        .room {
            display: none;
        }
        .room.active {
            display: block;
        }
        h2 {
            color: #333;
            margin-bottom: 30px;
        }
        .door-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .door {
            width: 120px;
            height: 180px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .door:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .blue-door {
            background-color: #3498db;
            border: 4px solid #2980b9;
        }
        .red-door {
            background-color: #e74c3c;
            border: 4px solid #c0392b;
        }
        .result-box {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.6;
        }
        .restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1번방 -->
    <div id="room1" class="room active">
        <h2>🚪 1번방</h2>
        <p>어떤 문으로 나아가시겠습니까?</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(1, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(1, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 2번방 -->
    <div id="room2" class="room">
        <h2>🚪 2번방</h2>
        <p>어떤 문으로 나아가시겠습니까?</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(2, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(2, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 3번방 -->
    <div id="room3" class="room">
        <h2>🚪 3번방</h2>
        <p>어떤 문으로 나아가시겠습니까?</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(3, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(3, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 4번방 -->
    <div id="room4" class="room">
        <h2>🚪 4번방</h2>
        <p>어떤 문으로 나아가시겠습니까?</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(4, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(4, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 5번방 -->
    <div id="room5" class="room">
        <h2>🚪 5번방</h2>
        <p>마지막 선택의 방입니다.</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(5, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(5, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 마지막 결과 창 -->
    <div id="roomResult" class="room">
        <h2>🎉 테스트 결과</h2>
        <div id="resultText" class="result-box"></div>
        <button class="restart-btn" onclick="restartTest()">다시 하기</button>
    </div>
</div>

<script>
    // MBTI 변수 초기화
    let E = 0, I = 0;
    let N = 0, S = 0;
    let T = 0, F = 0;
    let J = 0, P = 0;

    // 문 클릭 시 점수 계산 및 방 이동 함수
    function selectDoor(roomNum, doorColor) {
        // 점수 계산 규칙 적용
        if (roomNum === 1) {
            if (doorColor === 'blue') E += 1;
            else I += 1;
            nextRoom('room2');
        } 
        else if (roomNum === 2) {
            if (doorColor === 'blue') N += 1;
            else S += 1;
            nextRoom('room3');
        } 
        else if (roomNum === 3) {
            if (doorColor === 'blue') T += 2; // T 2점 증가
            else F += 2; // F 2점 증가
            nextRoom('room4');
        } 
        else if (roomNum === 4) {
            if (doorColor === 'blue') J += 1;
            else P += 1;
            nextRoom('room5');
        } 
        else if (roomNum === 5) {
            if (doorColor === 'blue') T += 1; // T 1점 증가
            else F += 1; // F 1점 증가
            showResult();
        }
    }

    // 화면 전환 함수
    function nextRoom(nextRoomId) {
        // 모든 방 숨기기
        document.querySelectorAll('.room').forEach(room => {
            room.classList.remove('active');
        });
        // 다음 방 보여주기
        document.getElementById(nextRoomId).classList.add('active');
    }

    // 결과 계산 및 출력 함수
    function showResult() {
        let result_mbti = "";

        // 1. E vs I 비교
        result_mbti += (E >= I) ? "E" : "I";

        // 2. N vs S 비교
        result_mbti += (N >= S) ? "N" : "S";

        // 3. T vs F 비교
        result_mbti += (T >= F) ? "T" : "F";

        // 4. J vs P 비교
        result_mbti += (J >= P) ? "J" : "P";

        // 결과 텍스트 삽입 후 창 전환
        document.getElementById('resultText').innerText = "당신의 mbti는 " + result_mbti + "입니다!";
        nextRoom('roomResult');
    }

    // 테스트 초기화 함수
    function restartTest() {
        E = 0; I = 0; N = 0; S = 0; T = 0; F = 0; J = 0; P = 0;
        nextRoom('room1');
    }
</script>

</body>
</html>
