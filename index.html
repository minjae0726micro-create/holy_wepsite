<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 방 탈출 테스트</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative; /* 워터마크 고정을 위한 설정 */
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }
        .room {
            display: none;
        }
        .room.active {
            display: block;
        }
        h2 {
            color: #333;
            margin-bottom: 30px;
        }
        .door-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .door {
            width: 120px;
            height: 180px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .door:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .blue-door {
            background-color: #3498db;
            border: 4px solid #2980b9;
        }
        .red-door {
            background-color: #e74c3c;
            border: 4px solid #c0392b;
        }
        
        /* 결과 창 및 종이 가림막 스타일 */
        .result-wrapper {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .result-box {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }
        .paper-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #7f8c8d;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            transition: opacity 0.5s ease, transform 0.5s ease;
            user-select: none;
        }
        /* 종이가 걷혀질 때의 효과 */
        .paper-cover.reveal {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none; /* 클릭 차단 */
        }

        .restart-btn {
            margin-top: 25px;
            padding: 10px 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* 오른쪽 아래 제작자 표시 */
        .watermark {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 14px;
            color: #7f8c8d;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1번방 -->
    <div id="room1" class="room active">
        <h2>🚪 1번방</h2>
        <p>어떤 문으로 나아가시겠습니까?</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(1, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(1, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 2번방 -->
    <div id="room2" class="room">
        <h2>🚪 2번방</h2>
        <p>어떤 문으로 나아가시겠습니까?</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(2, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(2, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 3번방 -->
    <div id="room3" class="room">
        <h2>🚪 3번방</h2>
        <p>어떤 문으로 나아가시겠습니까?</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(3, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(3, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 4번방 -->
    <div id="room4" class="room">
        <h2>🚪 4번방</h2>
        <p>어떤 문으로 나아가시겠습니까?</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(4, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(4, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 5번방 -->
    <div id="room5" class="room">
        <h2>🚪 5번방</h2>
        <p>마지막 선택의 방입니다.</p>
        <div class="door-container">
            <div class="door blue-door" onclick="selectDoor(5, 'blue')">파란문</div>
            <div class="door red-door" onclick="selectDoor(5, 'red')">빨간문</div>
        </div>
    </div>

    <!-- 마지막 결과 창 -->
    <div id="roomResult" class="room">
        <h2>🎉 테스트 결과</h2>
        <div class="result-wrapper">
            <!-- 결과 텍스트 (뒤에 숨겨짐) -->
            <div id="resultText" class="result-box"></div>
            <!-- 결과를 가리는 흰색 종이 -->
            <div id="paperCover" class="paper-cover" onclick="revealResult()">
                📄 흰색 종이를 클릭하여 결과를 확인하세요!
            </div>
        </div>
        <button class="restart-btn" onclick="restartTest()">다시 하기</button>
    </div>
</div>

<!-- 오른쪽 아래 고정 문구 -->
<div class="watermark">made by SHMS_atomic</div>

<script>
    // MBTI 변수 초기화
    let E = 0, I = 0;
    let N = 0, S = 0;
    let T = 0, F = 0;
    let J = 0, P = 0;

    function selectDoor(roomNum, doorColor) {
        if (roomNum === 1) {
            if (doorColor === 'blue') E += 1;
            else I += 1;
            nextRoom('room2');
        } 
        else if (roomNum === 2) {
            if (doorColor === 'blue') N += 1;
            else S += 1;
            nextRoom('room3');
        } 
        else if (roomNum === 3) {
            if (doorColor === 'blue') T += 2;
            else F += 2;
            nextRoom('room4');
        } 
        else if (roomNum === 4) {
            if (doorColor === 'blue') J += 1;
            else P += 1;
            nextRoom('room5');
        } 
        else if (roomNum === 5) {
            if (doorColor === 'blue') T += 1;
            else F += 1;
            showResult();
        }
    }

    function nextRoom(nextRoomId) {
        document.querySelectorAll('.room').forEach(room => {
            room.classList.remove('active');
        });
        document.getElementById(nextRoomId).classList.add('active');
    }

    function showResult() {
        let result_mbti = "";

        result_mbti += (E >= I) ? "E" : "I";
        result_mbti += (N >= S) ? "N" : "S";
        result_mbti += (T >= F) ? "T" : "F";
        result_mbti += (J >= P) ? "J" : "P";

        document.getElementById('resultText').innerText = "당신의 mbti는 " + result_mbti + "입니다!";
        
        // 다시 시작할 때를 대비해 종이 가림막 상태 원상복구
        document.getElementById('paperCover').classList.remove('reveal');
        
        nextRoom('roomResult');
    }

    // 흰색 종이를 클릭했을 때 호출되는 함수
    function revealResult() {
        document.getElementById('paperCover').classList.add('reveal');
    }

    function restartTest() {
        E = 0; I = 0; N = 0; S = 0; T = 0; F = 0; J = 0; P = 0;
        nextRoom('room1');
    }
</script>

</body>
</html>
